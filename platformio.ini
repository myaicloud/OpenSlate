; =============================================================================
; OpenSlate — PlatformIO Configuration
; =============================================================================
; Open-source replica for camera control.
; Bridge between Betaflight FC (MSP/UART) and DJI Action 2 (BLE).
;
; Two hardware targets, one source tree. The pin defaults are selected per
; target in src/config.h (CONFIG_IDF_TARGET_ESP32C3 from sdkconfig.h), so both
; envs below build the identical firmware logic:
;
;   esp32c3   ESP32-C3 DevKitM-1            pio run -e esp32c3
;   esp32dev  ESP32 DevKitC / WROOM-32      pio run -e esp32dev
;   *_release flight builds of both (no DBG output, CORE_DEBUG_LEVEL=1)
;
; Override any pin from the command line without touching config.h, e.g.
;   pio run -e esp32dev --project-option "build_flags=-D FC_UART_RX_PIN=4"
; =============================================================================

; ---------- Shared settings for both ESP32 targets --------------------------
[esp32_base]
framework = arduino
; NimBLE BLE library (mandatory — replaces Bluedroid). Both envs inherit it.
lib_deps =
    h2zero/NimBLE-Arduino@1.4.1
; App needs > 1.2 MB (BLE + WiFi + Web UI); min_spiffs gives 1.875 MB per OTA
; slot and still fits the 4 MB flash of both boards.
board_build.partitions = min_spiffs.csv
; Common flags. The log level is set per env below:
;   esp32c3 / esp32dev           bench builds, CORE_DEBUG_LEVEL=3 + DBG() on
;   *_release                    flight builds, CORE_DEBUG_LEVEL=1, DBG() off
build_flags_common =
    -I src
    -include ble_build_config.h
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=256
build_flags_bench =
    ${esp32_base.build_flags_common}
    -D CORE_DEBUG_LEVEL=3
build_flags_release =
    ${esp32_base.build_flags_common}
    -D CORE_DEBUG_LEVEL=1
    -D DEBUG_DISABLED
build_flags = ${esp32_base.build_flags_bench}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:esp32c3]
extends = esp32_base
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32dev]
extends = esp32_base
platform = espressif32
board = esp32dev

; ---------- Flight builds: no USB debug output -----------------------------
;   pio run -e esp32c3_release      pio run -e esp32dev_release
[env:esp32c3_release]
extends = env:esp32c3
build_flags = ${esp32_base.build_flags_release}

[env:esp32dev_release]
extends = env:esp32dev
build_flags = ${esp32_base.build_flags_release}

; =============================================================================
; Host unit tests  (pio test -e native)
; =============================================================================
; Compiles the pure protocol modules on the PC — no board attached. Arduino.h
; is stubbed from test/stub so the real sources stay unchanged.
[env:native]
platform = native
test_framework = unity
; Build the pure protocol sources from src/ for the test binaries.
test_build_src = yes
build_src_filter =
    +<duml_codec.cpp>
    +<msp_protocol.cpp>
    +<autobind_match.cpp>
    +<camera_slot_policy.cpp>
build_flags =
    -std=gnu++11
    -D UNITY_INCLUDE_DOUBLE
    -D DEBUG_DISABLED
    -D OPENSLATE_HOST_TEST
    -I test/stub
    -I src
test_filter = test_duml, test_msp, test_autobind, test_camera_slots, test_camera_backends
; PlatformIO has no host compiler on Windows by default.
platform_packages =
    platformio/toolchain-gccmingw32
